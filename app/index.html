<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c5cab">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Controle financeiro pessoal: receitas, despesas por grupo, investimentos e saldo mensal.">
<title>Controle Financeiro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-row">
    <h1 id="title">Controle Financeiro</h1>
    <button id="syncBtn" class="sync-btn" type="button" hidden aria-label="Sincronizar com a planilha">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6M20 4v5h-5M20 12a8 8 0 0 1-13.7 5.6M4 20v-5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="syncLabel">Planilha</span>
    </button>
  </div>
  <div class="period" id="period">
    <button type="button" class="icon-btn" id="prevBtn" aria-label="Mês anterior">‹</button>
    <div class="period-label" id="periodLabel"></div>
    <button type="button" class="icon-btn" id="nextBtn" aria-label="Próximo mês">›</button>
  </div>
</header>
<div id="authBanner" class="auth-banner" hidden>
  <span>Entre com Google para sincronizar.</span>
  <button class="btn sm primary" id="authBtn" type="button">Entrar com Google</button>
</div>

<main id="view" tabindex="-1"></main>

<nav class="tabbar" aria-label="Navegação">
  <button type="button" data-tab="graficos" class="active">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    <span>Gráficos</span></button>
  <button type="button" data-tab="mes">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    <span>Mês</span></button>
  <button type="button" data-tab="ano">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M9 4v16"/></svg>
    <span>Resumo</span></button>
  <button type="button" data-tab="ajustes">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    <span>Ajustes</span></button>
</nav>

<section id="entrada" class="entrada" hidden>
  <div class="entrada-card">
    <h1>Controle Financeiro</h1>
    <p id="entradaTexto"></p>
    <button class="btn block primary" id="entrarGoogle" type="button">Entrar com Google</button>
    <button class="btn block" id="verSemSync" type="button" hidden>Ver sem sincronizar</button>
    <button class="btn block" id="usarLocal" type="button">Usar só neste aparelho</button>
  </div>
</section>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="dialog"><form method="dialog" id="dialogForm"></form></dialog>

<script src="sheets.js"></script>
<script src="app.js"></script>
</body>
</html>
